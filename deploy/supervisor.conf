; /etc/supervisor/conf.d/simasjid.conf
;
; Proyek ini menggunakan QUEUE_CONNECTION=database (lihat .env) — cukup untuk volume
; job saat ini (notifikasi WA, PDF, resi donasi). Jika volume job meningkat, ganti
; QUEUE_CONNECTION ke redis dan sesuaikan command di bawah tanpa mengubah command lain.
;
; user=www-data mengasumsikan PHP-FPM/Nginx jalan sebagai www-data (default Ubuntu).
; Cek pool PHP-FPM di server ini (/etc/php/*/fpm/pool.d/www.conf, baris "user =")
; dan sesuaikan kalau berbeda — kalau proses lain di server ini jalan sebagai root,
; pastikan juga permission storage/bootstrap/cache cocok dengan user yang dipakai di sini.

[program:simasjid-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/tpq/artisan queue:work database --queue=default --tries=3 --backoff=10 --sleep=3 --max-time=3600
directory=/var/www/html/tpq
autostart=true
autorestart=true
numprocs=3
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/html/tpq/storage/logs/worker.log
stopwaitsecs=60

[program:simasjid-reverb]
process_name=%(program_name)s
command=php /var/www/html/tpq/artisan reverb:start --host=127.0.0.1 --port=8080
directory=/var/www/html/tpq
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/html/tpq/storage/logs/reverb.log
