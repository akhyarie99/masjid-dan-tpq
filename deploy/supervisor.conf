; /etc/supervisor/conf.d/simasjid.conf
;
; Proyek ini menggunakan QUEUE_CONNECTION=database (lihat .env) — cukup untuk volume
; job saat ini (notifikasi WA, PDF, resi donasi). Jika volume job meningkat, ganti
; QUEUE_CONNECTION ke redis dan sesuaikan command di bawah tanpa mengubah command lain.

[program:simasjid-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/simasjid/artisan queue:work database --queue=default --tries=3 --backoff=10 --sleep=3 --max-time=3600
directory=/var/www/simasjid
autostart=true
autorestart=true
numprocs=3
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/simasjid/storage/logs/worker.log
stopwaitsecs=60

[program:simasjid-reverb]
process_name=%(program_name)s
command=php /var/www/simasjid/artisan reverb:start --host=127.0.0.1 --port=8080
directory=/var/www/simasjid
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/simasjid/storage/logs/reverb.log
