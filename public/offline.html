<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline - SiMasjid</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 12px;
            font-family: system-ui, -apple-system, sans-serif;
            background: #f8fafc;
            color: #1e293b;
            text-align: center;
            padding: 24px;
        }
        h1 { font-size: 1.25rem; margin: 0; }
        p { margin: 0; color: #64748b; }
        button {
            margin-top: 8px;
            padding: 8px 20px;
            border: none;
            border-radius: 8px;
            background: #16a34a;
            color: #fff;
            font-size: 0.95rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Anda sedang offline</h1>
    <p>Halaman ini belum tersedia di cache. Periksa koneksi internet Anda.</p>
    <button onclick="location.reload()">Coba Lagi</button>
</body>
</html>
